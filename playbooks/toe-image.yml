---
# TOE image rollout: switch the image of the TOE Deployment (kube-system/toe) on a device to an
# immutable, digest-pinned reference, and roll back.
#
# Why a playbook: the TOE Deployment lives in /var/lib/rancher/k3s/server/manifests/teknoir.yaml, which k3s
# re-applies when the file changes and at start. `kubectl set image` is reverted, and the config channel
# cannot change it (it would overwrite itself). So this playbook edits that one file:
#   - pulls the image first (`k3s crictl pull`) and checks its digest, so an unpullable image never reaches
#     the manifest (the watchdog reboots a device whose TOE is not Ready: an unpullable image is a reboot loop),
#   - copies the manifest to a backup OUTSIDE the manifests directory (k3s would apply a backup inside it),
#   - replaces only the `image:` line of the toe container (the one after `command: - /manager`) and sets
#     `imagePullPolicy: IfNotPresent` on it (the pinned image stays in the containerd cache),
#   - before anything is changed, lists what the new TOE would delete on its first start: items recorded in
#     toe-config (status.last_applied_config) that the config (spec.config.items) no longer has. The old TOE
#     returned on its first create error before pruning, so such items can still be running on the device (a
#     HelmChart would be uninstalled). The run is refused unless -e toe_allow_prune=true,
#   - also before anything is changed, asks the apiserver what the new TOE would create or change on its first
#     start (`kubectl diff --server-side --field-manager=toe --force-conflicts` per config item: a server-side
#     dry run, nothing is written) and which items the apiserver refuses as a server-side apply (an unknown
#     field or a duplicate list key; the new TOE then applies them with create/merge patch and drops what the
#     apiserver does not know). The old TOE stopped at its first error, did not recreate objects removed by
#     hand and skipped changes, so the new TOE's first pass can install and upgrade charts and roll Deployments.
#     The run is refused unless -e toe_allow_changes=true,
#   - waits for the Deployment to carry the new image and `rollout status` (<= 5 min),
#   - on failure restores the backup and waits for the old TOE to be Ready again, then fails the run,
#   - prints the image, the imageID and the restarts of the TOE pod.
#
#   tnctl ansible-playbook playbooks/toe-image.yml --limit vm-fresh-01 \
#     -e toe_image=ghcr.io/teknoir/toe-app:sha-1a2b3c4d@sha256:<64 hex>
#
#   # Only look: prints the plan and the diff of the manifest, changes nothing (no pull, no restart)
#   tnctl ansible-playbook playbooks/toe-image.yml --limit vm-fresh-01 --check --diff -e toe_image=...
#
#   # Roll back: restore the newest backup (or -e toe_backup=<path>), wait for the TOE to be Ready
#   tnctl ansible-playbook playbooks/toe-image.yml --limit vm-fresh-01 -e toe_rollback=true
#
# Variables
#   toe_image          required (unless toe_rollback=true): <registry>/<repo>[:<tag>]@sha256:<digest>. A reference
#                      without a digest is refused: a moving tag is exactly what this playbook exists to avoid.
#   toe_rollback       default false. true restores a backup instead (toe_image is not needed).
#   toe_backup         with toe_rollback: the backup file to restore (default: the newest in toe_backup_dir).
#   toe_wait_timeout   rollout wait in seconds, default 300.
#   toe_allow_prune    default false. Accept that the new TOE deletes the items listed by the pre-flight check.
#   toe_allow_changes  default false. Accept that the new TOE creates or changes the items listed by the pre-flight check
#                      (or applies them with create/merge patch, or fails on them).
#   toe_allow_many     default false. Allow --limit all / a wildcard / a pattern that matches more than one device.
#   toe_manifest, toe_backup_dir, toe_namespace, toe_deployment, toe_kubectl_cmd, toe_crictl_cmd, toe_use_become:
#                      where things are; the defaults fit a Teknoir device. They exist so the playbook can be tried
#                      against a throwaway target (README).
#
# Backups: <toe_backup_dir>/teknoir.yaml.bak-<UTC timestamp> (default /var/lib/rancher/k3s/server/toe-image-backups).
# Never run against a device without --limit, and --limit must name exactly one device (all, wildcards and groups
# are refused unless -e toe_allow_many=true); the run is serial 1 and stops at the first failure
# (max_fail_percentage 0). Roll out VM first, then one device, then the rest. Production only with Anders' OK.

- name: Roll the TOE image of a device (digest-pinned, with backup and rollback)
  hosts: all
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  vars:
    toe_image: ""
    toe_rollback: false
    toe_backup: ""
    toe_wait_timeout: 300
    toe_allow_prune: false
    toe_allow_changes: false
    toe_allow_many: false
    toe_cr: toes.teknoir.org
    toe_cr_name: toe-config
    toe_use_become: true
    toe_image_re: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]+)?(/[a-z0-9._-]+)+(:[A-Za-z0-9_][A-Za-z0-9._-]{0,127})?@sha256:[0-9a-f]{64}$'
    toe_jsonpath_pods: >-
      {range .items[*]}{.metadata.name} {.spec.containers[?(@.name=="toe")].image}
      {.status.containerStatuses[?(@.name=="toe")].imageID}
      restarts={.status.containerStatuses[?(@.name=="toe")].restartCount}{"\n"}{end}
  become: "{{ toe_use_become | bool }}"
  # toe_manifest, toe_backup_dir, toe_namespace, toe_deployment, toe_kubectl_cmd, toe_crictl_cmd, toe_re and the argv of the waits
  vars_files:
    - vars/toe-manifest.yml

  tasks:
    - name: Refuse to run without --limit
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Pass --limit <device>. This playbook never runs against every device."
        quiet: true

    - name: Refuse --limit all, wildcards and patterns that match more than one device
      ansible.builtin.assert:
        that:
          - toe_allow_many | bool or ansible_limit is not search('(^|[,:])\s*all\s*([,:]|$)')
          - toe_allow_many | bool or ansible_limit is not search('[*?~!&\[]')
          - toe_allow_many | bool or ansible_play_hosts_all | length == 1
        fail_msg: >-
          --limit '{{ ansible_limit }}' matches {{ ansible_play_hosts_all | length }} device(s). Name exactly one device;
          roll out one device at a time (VM first). To roll several on purpose pass -e toe_allow_many=true.
        quiet: true

    - name: Validate the image reference
      ansible.builtin.assert:
        that:
          - toe_image is string
          - toe_image is match(toe_image_re)
        fail_msg: >-
          Pass -e toe_image=<registry>/<repo>[:<tag>]@sha256:<64 hex digits>. A reference without a digest is refused.
          Got: '{{ toe_image }}'
        quiet: true
      when: not (toe_rollback | bool)

    - name: Read the TOE manifest and find the toe container (shared with rebootstrap-device.yml)
      ansible.builtin.import_tasks: tasks/toe-manifest-read.yml

    - name: Refuse a manifest where the toe container is not found exactly once
      ansible.builtin.assert:
        that: toe_found | length == 1
        fail_msg: >-
          {{ toe_manifest }}: expected exactly one toe container (`command: - /manager` followed by image and
          imagePullPolicy), found {{ toe_found | length }}. Nothing was changed.
        quiet: true

    - name: Current TOE image line
      ansible.builtin.set_fact:
        toe_old_image: "{{ toe_found[0][1] }}"
        toe_old_policy: "{{ toe_found[0][3] }}"

    # ------------------------------------------------------------------ rollout
    - name: Roll out the TOE image
      when: not (toe_rollback | bool)
      block:
        - name: Plan
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: {{ toe_old_image }} ({{ toe_old_policy }}) -> {{ toe_image }} (IfNotPresent){{
              '; already in place, nothing to change' if (toe_old_image == toe_image and toe_old_policy == 'IfNotPresent') else '' }}

        # What the new TOE deletes on its first start. The new TOE prunes every recorded item that the config no
        # longer has; the old TOE did not when an apply failed (it returned before pruning), so such items may
        # still run on this device. Same identity as the TOE: API group, kind, namespace (none for a cluster-scoped
        # kind, "default" when a namespaced item has none) and name.
        - name: Which kinds are cluster-scoped on this device
          ansible.builtin.command:
            argv: "{{ toe_kubectl_cmd + ['api-resources', '--namespaced=false', '--no-headers'] }}"
          register: toe_cluster_scoped
          changed_when: false
          check_mode: false

        - name: Read the TOE config and what the TOE recorded as applied
          ansible.builtin.command:
            argv: "{{ toe_kubectl_cmd + ['get', toe_cr, toe_cr_name, '-o', 'json'] }}"
          register: toe_cr_out
          changed_when: false
          check_mode: false
          no_log: true  # the config items can be Secrets
          failed_when:
            - toe_cr_out.rc != 0
            - "'NotFound' not in toe_cr_out.stderr"
            - "'not found' not in toe_cr_out.stderr"
            - "'doesn\\'t have a resource type' not in toe_cr_out.stderr"

        - name: Cluster-scoped kinds as group/Kind
          ansible.builtin.set_fact:
            toe_cluster_kinds: >-
              {%- set cluster = [] -%}
              {%- for av, k in toe_cluster_scoped.stdout | regex_findall('(\S+)\s+false\s+(\S+)[ \t]*$', multiline=True) -%}
              {%- set _ = cluster.append((av.split('/')[0] if '/' in av else '') ~ '/' ~ k) -%}
              {%- endfor -%}
              {{ cluster | to_json }}

        - name: Items the new TOE would delete on its first start
          no_log: true  # derived from the config items, which can be Secrets
          ansible.builtin.set_fact:
            toe_prune_keys: >-
              {%- set cluster = toe_cluster_kinds | from_json -%}
              {%- macro keys(items) -%}
              {%- set out = [] -%}
              {%- for it in items -%}
              {%- set av = it.apiVersion | default('') -%}
              {%- set g = av.split('/')[0] if '/' in av else '' -%}
              {%- set md = it.metadata | default({}) -%}
              {%- set ns = '' if (g ~ '/' ~ it.kind) in cluster else (md.namespace | default('', true) or 'default') -%}
              {%- set _ = out.append(g ~ '/' ~ it.kind ~ ' ' ~ ns ~ '/' ~ md.name | default('')) -%}
              {%- endfor -%}
              {{ out | to_json }}
              {%- endmacro -%}
              {%- set cr = (toe_cr_out.stdout | default('{}', true) | from_json) -%}
              {%- set spec = keys(((cr.spec | default({})).config | default({})).get('items') or []) | from_json -%}
              {%- set rec = keys(((cr.status | default({})).last_applied_config | default({})).get('items') or []) | from_json -%}
              {{ rec | difference(spec) | unique | list | to_json }}

        - name: Pre-flight, items recorded as applied and no longer in the config
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: {{ toe_prune_keys | from_json | length }} item(s) the new TOE would delete on its first start{{
              ': ' ~ (toe_prune_keys | from_json | join(', ')) if toe_prune_keys | from_json | length > 0 else '' }}

        - name: Refuse to roll while the new TOE would delete items (unless -e toe_allow_prune=true)
          ansible.builtin.assert:
            that: toe_allow_prune | bool or (toe_prune_keys | from_json | length) == 0 or (toe_old_image == toe_image and toe_old_policy == 'IfNotPresent')
            fail_msg: >-
              {{ inventory_hostname }}: the new TOE would delete {{ toe_prune_keys | from_json | length }} item(s) on its first start:
              {{ toe_prune_keys | from_json | join(', ') }}. The old TOE never pruned them (it stopped at its first create error),
              so they may still run here; a HelmChart would be uninstalled. Nothing was changed. Check them
              (kubectl get toes.teknoir.org toe-config -o yaml), fix the device config, or pass -e toe_allow_prune=true
              to accept the deletes.
            quiet: true

        # What the new TOE does to the live objects on its first start. It re-applies every item (server-side
        # apply, field manager toe, forced). The old TOE stopped at its first create error, never recreated
        # objects deleted by hand while the record matched, skipped changes and ignored patch errors; so on a
        # device that ran the old TOE the first start can create objects (helm installs of charts that never
        # ran or were removed on purpose), change them (helm upgrades, Deployment rollouts) and find items the
        # apiserver refuses as a server-side apply (an unknown field, a duplicate list key: the TOE then falls
        # back to create/merge patch). `kubectl diff --server-side` asks the apiserver for exactly that
        # (a server-side dry run); nothing is written. Exit code 0 = no difference, 1 = difference, 2 = error.
        - name: The config items, as the new TOE applies them (no status, namespace like the TOE)
          no_log: true  # the items can be Secrets
          ansible.builtin.set_fact:
            toe_spec_items: >-
              {%- set cluster = toe_cluster_kinds | from_json -%}
              {%- set cr = (toe_cr_out.stdout | default('{}', true) | from_json) -%}
              {%- set out = [] -%}
              {%- for it in ((cr.spec | default({})).config | default({})).get('items') or [] -%}
              {%- set av = it.apiVersion | default('') -%}
              {%- set g = av.split('/')[0] if '/' in av else '' -%}
              {%- set md = it.metadata | default({}) -%}
              {%- set base = it | dict2items | rejectattr('key', 'eq', 'status') | list | items2dict -%}
              {%- set md1 = md | dict2items | rejectattr('key', 'eq', 'namespace') | list | items2dict -%}
              {%- set md2 = md1 if (g ~ '/' ~ it.kind) in cluster else (md1 | combine({'namespace': md.namespace | default('', true) or 'default'})) -%}
              {%- set _ = out.append(base | combine({'metadata': md2})) -%}
              {%- endfor -%}
              {{ out | to_json }}

        - name: Server-side dry run of every config item (nothing is written)
          ansible.builtin.command:
            argv: "{{ toe_kubectl_cmd + ['diff', '--server-side', '--field-manager=toe', '--force-conflicts', '-f', '-'] }}"
            stdin: "{{ toe_item | to_json }}"
          loop: "{{ toe_spec_items | from_json }}"
          loop_control:
            loop_var: toe_item
            label: "{{ toe_item.kind }} {{ toe_item.metadata.namespace | default('') }}/{{ toe_item.metadata.name | default('') }}"
          register: toe_diff
          changed_when: false
          failed_when: false
          check_mode: false
          no_log: true  # the items can be Secrets

        - name: Classify the items, creates, changes, items the apiserver refuses as server-side apply, errors
          ansible.builtin.set_fact:
            toe_plan: >-
              {%- set out = {'create': [], 'change': [], 'fallback': [], 'error': []} -%}
              {%- set made = [] -%}
              {%- for r in toe_diff.results -%}
              {%- if r.rc | default(2) == 1 and '@@ -0,0 ' in r.stdout | default('') and r.toe_item.kind == 'Namespace' -%}
              {%- set _ = made.append(r.toe_item.metadata.name) -%}
              {%- endif -%}
              {%- endfor -%}
              {%- for r in toe_diff.results -%}
              {%- set md = r.toe_item.metadata -%}
              {%- set label = r.toe_item.kind ~ ' ' ~ ((md.namespace ~ '/') if md.namespace is defined else '') ~ md.name -%}
              {%- set err = r.stderr | default(r.msg | default('')) -%}
              {%- set ns_missing = err | regex_findall('namespaces "([^"]+)" not found') -%}
              {%- set rc = r.rc | default(2) -%}
              {%- if rc == 0 -%}
              {%- elif rc == 1 -%}
              {%- set _ = (out.create if '@@ -0,0 ' in r.stdout | default('') else out.change).append(label) -%}
              {%- elif 'failed to create typed patch object' in err -%}
              {%- set _ = out.fallback.append(label) -%}
              {%- elif ns_missing | length > 0 and ns_missing[0] in made -%}
              {%- set _ = out.create.append(label) -%}
              {%- else -%}
              {%- set _ = out.error.append(label ~ ' (' ~ ((err | trim).split('\n')[0])[:200] ~ ')') -%}
              {%- endif -%}
              {%- endfor -%}
              {{ out | to_json }}

        - name: Pre-flight, what the new TOE does to the live objects on its first start
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: {{ (toe_plan | from_json).create | length }} create, {{ (toe_plan | from_json).change | length }} change,
              {{ (toe_plan | from_json).fallback | length }} refused as server-side apply (applied with create/merge patch, unknown fields dropped),
              {{ (toe_plan | from_json).error | length }} error(s)
              {%- for k in ['create', 'change', 'fallback', 'error'] -%}
              {%- if (toe_plan | from_json)[k] | length > 0 %}; {{ k }}: {{ (toe_plan | from_json)[k] | join(', ') }}{% endif -%}
              {%- endfor %}

        - name: Refuse to roll while the new TOE would create or change things (unless -e toe_allow_changes=true)
          ansible.builtin.assert:
            that: >-
              toe_allow_changes | bool or
              ((toe_plan | from_json).create + (toe_plan | from_json).change + (toe_plan | from_json).fallback + (toe_plan | from_json).error) | length == 0 or
              (toe_old_image == toe_image and toe_old_policy == 'IfNotPresent')
            fail_msg: >-
              {{ inventory_hostname }}: on its first start the new TOE re-applies every config item, and it would
              create {{ (toe_plan | from_json).create | join(', ') | default('-', true) }};
              change {{ (toe_plan | from_json).change | join(', ') | default('-', true) }};
              apply the old way (the apiserver refuses these as server-side apply) {{ (toe_plan | from_json).fallback | join(', ') | default('-', true) }};
              fail on {{ (toe_plan | from_json).error | join(', ') | default('-', true) }}.
              Helm installs and upgrades and Deployment rollouts happen at once, the old TOE never did all of this.
              Nothing was changed. Look at the device first (kubectl diff --server-side --field-manager=toe --force-conflicts -f <item>),
              or pass -e toe_allow_changes=true to accept.
            quiet: true

        - name: Pre-pull the image and check its digest (shared with rebootstrap-device.yml)
          ansible.builtin.import_tasks: tasks/toe-image-pull.yml

        - name: Back up the manifest, put the image on the toe container, wait for the rollout (shared with rebootstrap-device.yml)
          ansible.builtin.import_tasks: tasks/toe-manifest-set-image.yml

      rescue:
        - name: Failed, restore the backup (if the manifest was changed)
          ansible.builtin.copy:
            src: "{{ toe_bak.dest }}"
            dest: "{{ toe_manifest }}"
            remote_src: true
            mode: preserve
          when: toe_bak is defined and toe_bak.dest is defined

        - name: Wait for the old TOE to be Ready again
          ansible.builtin.command:
            argv: "{{ toe_kubectl_cmd + toe_wait_argv }}"
          changed_when: false
          failed_when: false
          register: toe_restored
          when: toe_bak is defined and toe_bak.dest is defined

        - name: Rollout failed
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: the TOE rollout to {{ toe_image }} failed and the previous manifest was
              {{ 'restored (rollout status of the old TOE rc=' ~ (toe_restored.rc | default('?')) ~ ')' if toe_bak is defined and toe_bak.dest is defined
              else 'not touched (no backup was made)' }}.
              The run stops here (serial 1, max_fail_percentage 0).

    # ------------------------------------------------------------------ rollback
    - name: Roll back the TOE image
      when: toe_rollback | bool
      block:
        - name: Find the backups
          ansible.builtin.find:
            paths: "{{ toe_backup_dir }}"
            patterns: "teknoir.yaml.bak-*"
          register: toe_baks

        - name: Choose the backup
          ansible.builtin.set_fact:
            toe_restore_from: >-
              {{ toe_backup if toe_backup != '' else
              (toe_baks.files | sort(attribute='path') | map(attribute='path') | list | last | default('')) }}

        - name: Refuse without a backup
          ansible.builtin.assert:
            that: toe_restore_from != ''
            fail_msg: "No backup in {{ toe_backup_dir }} and no -e toe_backup=<file>. Nothing was changed."
            quiet: true

        - name: Read the backup
          ansible.builtin.slurp:
            src: "{{ toe_restore_from }}"
          register: toe_bak_file
          no_log: true  # the manifest holds Secrets (image pull secrets); only the toe container's regex groups are kept

        - name: Find the toe container in the backup
          ansible.builtin.set_fact:
            toe_bak_found: "{{ (toe_bak_file.content | b64decode) | regex_findall(toe_re, multiline=True) }}"

        - name: The backup holds exactly one toe container
          ansible.builtin.assert:
            that: toe_bak_found | length == 1
            fail_msg: "{{ toe_restore_from }} does not look like the Teknoir manifest. Nothing was changed."
            quiet: true

        - name: Plan
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: restore {{ toe_restore_from }}
              (image {{ toe_bak_found[0][1] }}) over {{ toe_manifest }} (image {{ toe_old_image }})

        - name: Keep the manifest that is being replaced
          ansible.builtin.copy:
            src: "{{ toe_manifest }}"
            dest: "{{ toe_backup_dir }}/teknoir.yaml.pre-rollback-{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
            remote_src: true
            mode: preserve

        - name: Restore the backup
          ansible.builtin.copy:
            src: "{{ toe_restore_from }}"
            dest: "{{ toe_manifest }}"
            remote_src: true
            mode: preserve

        - name: Wait for the Deployment to carry the restored image
          ansible.builtin.command:
            argv: "{{ toe_kubectl_cmd + toe_get_image_argv }}"
          register: toe_cur
          vars:
            toe_want: "{{ toe_bak_found[0][1] }}"
          until: toe_cur.stdout == toe_want
          retries: "{{ (toe_wait_timeout | int / 5) | int }}"
          delay: 5
          changed_when: false
          when: not ansible_check_mode

        - name: Wait for the rollout
          ansible.builtin.command:
            argv: "{{ toe_kubectl_cmd + toe_wait_argv }}"
          changed_when: false
          when: not ansible_check_mode

    # ------------------------------------------------------------------ report
    - name: Read the TOE pod
      ansible.builtin.command:
        argv: "{{ toe_kubectl_cmd + ['-n', toe_namespace, 'get', 'pods', '-l', 'app=toe', '-o', toe_pods_jp] }}"
      vars:
        toe_pods_jp: "jsonpath={{ toe_jsonpath_pods | replace('\n', ' ') | trim }}"
      register: toe_pods
      changed_when: false
      check_mode: false

    - name: TOE after the run
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ toe_pods.stdout_lines }}"
