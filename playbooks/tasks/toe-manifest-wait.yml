---
# After the manifest is as wanted (and the Deployment carries the wanted image): wait until the Deployment has the
# nodeSelector (also when the image did not change), until the rollout is done, and, with toe_pin_server, until
# every live TOE pod runs on the server node (toe_pin_node, toe-pin-check.yml). Shared by toe-manifest-set-image.yml
# and the rollback in toe-image.yml. Needs toe_wait_timeout and the vars of playbooks/vars/toe-manifest.yml; the
# caller sets become.
- name: Wait for the Deployment to carry the nodeSelector (also when the image did not change)
  ansible.builtin.command:
    argv: "{{ toe_kubectl_cmd + toe_get_pin_argv }}"
  register: toe_cur_pin
  until: toe_cur_pin.stdout == 'true'
  retries: "{{ (toe_wait_timeout | int / 5) | int }}"
  delay: 5
  changed_when: false
  when: (toe_pin_server | bool) and not ansible_check_mode

- name: Wait for the rollout
  ansible.builtin.command:
    argv: "{{ toe_kubectl_cmd + toe_wait_argv }}"
  changed_when: false
  when: not ansible_check_mode

# Only live pods count: a pod of the incident ReplicaSet that is left behind on an agent node (Failed: Evicted,
# NodeAffinity, UnexpectedAdmissionError; Succeeded) or is being deleted does not run anything.
- name: The TOE pod runs on the server node (and only there)
  ansible.builtin.command:
    argv: "{{ toe_kubectl_cmd + toe_get_pod_nodes_argv }}"
  register: toe_pod_nodes
  until: (toe_live_pod_nodes | length) > 0 and toe_live_pod_nodes == [toe_pin_node]
  retries: "{{ (toe_wait_timeout | int / 5) | int }}"
  delay: 5
  changed_when: false
  when: (toe_pin_server | bool) and not ansible_check_mode
