---
# After the bootstrap script: when tn_toe_keep (toe-keep-remember.yml) is set and the script changed the
# TOE image line (another image, or imagePullPolicy other than IfNotPresent), put it back the way
# playbooks/toe-image.yml does: pre-pull and digest check first (toe-image-pull.yml, an unpullable image never
# reaches the manifest), then toe-manifest-set-image.yml (backup outside the manifests directory, image
# replaced, imagePullPolicy IfNotPresent, TOE pod pinned to the server node, wait for the rollout). The pin is put
# back too when the script's manifest lacks it (toe_pin_server, toe-pin-check.yml). Prints one status line. Fails the run, with
# the toe-image.yml command to run, when the image cannot be put back or the manifest cannot be understood
# any more; the manifest the script wrote is left (or restored after a failed rollout).
# Needs the vars of playbooks/vars/toe-manifest.yml, toe_wait_timeout and rebootstrap_device.
- name: Keep a digest-pinned TOE image across the re-bootstrap
  become: true
  block:
    - name: Read the TOE image line of the manifest again
      ansible.builtin.import_tasks: toe-manifest-read.yml
      vars:
        toe_read_optional: true

    - name: The manifest must still hold exactly one toe container when an image is to be kept
      ansible.builtin.fail:
        msg: >-
          {{ toe_manifest }} has {{ toe_found | length }} toe container(s) after the bootstrap script (expected
          exactly one: `command: - /manager` followed by image and imagePullPolicy){{ '; the file is missing' if not toe_manifest_present else '' }}.
      when: tn_toe_keep != '' and toe_found | length != 1

    - name: The TOE image now, and what to put back
      ansible.builtin.set_fact:
        toe_image: "{{ tn_toe_keep }}"
        toe_old_image: "{{ toe_found[0][1] if toe_found | length == 1 else '' }}"
        toe_old_policy: "{{ toe_found[0][3] if toe_found | length == 1 else '' }}"
        tn_toe_restore: >-
          {{ tn_toe_keep != '' and toe_found | length == 1
          and (toe_found[0][1] != tn_toe_keep or toe_found[0][3] != 'IfNotPresent' or (toe_pin_server | bool and toe_pod_state != 'present')) }}

    # The templates write the TOE pod spec without a nodeSelector: pin it to the server node again (toe-pin-check.yml
    # refuses when the pod spec cannot be found exactly once or the server node cannot be found).
    - name: Check that the TOE pod can be pinned to the server node (shared with toe-image.yml)
      ansible.builtin.import_tasks: toe-pin-check.yml
      when: tn_toe_restore | bool

    - name: Pre-pull the kept image and check its digest (shared with toe-image.yml)
      ansible.builtin.import_tasks: toe-image-pull.yml
      when: tn_toe_restore | bool

    - name: Put the digest-pinned TOE image back and wait for the rollout
      ansible.builtin.import_tasks: toe-manifest-set-image.yml
      when: tn_toe_restore | bool

    - name: The TOE image is settled
      ansible.builtin.set_fact:
        tn_toe_settled: true

    - name: TOE image
      ansible.builtin.debug:
        msg: >-
          {{ rebootstrap_device }}: TOE image: {{
          ('kept ' ~ tn_toe_keep ~ (' (put back after the bootstrap script, imagePullPolicy IfNotPresent'
          ~ (', pod pinned to node ' ~ toe_pin_node if toe_pin_server | bool else '') ~ ')'
          if tn_toe_restore | bool else ' (the script left it)'))
          if tn_toe_keep != '' else
          ('WARNING: TOE manifest not found at ' ~ toe_manifest ~ ': custom k3s data-dir? the TOE image was not kept'
          if (tn_toe_pre_missing | bool or not toe_manifest_present)
          else 'nothing to keep (no digest-pinned TOE image)') }}

  rescue:
    - name: Failed, restore the manifest the script wrote (if it was changed)
      ansible.builtin.copy:
        src: "{{ toe_bak.dest }}"
        dest: "{{ toe_manifest }}"
        remote_src: true
        mode: preserve
      diff: false  # the manifest holds Secrets: --diff must not print it
      when: toe_bak is defined and toe_bak.dest is defined

    - name: The hint below is the message
      ansible.builtin.set_fact:
        tn_toe_settled: true

    - name: The digest-pinned TOE image was not put back
      ansible.builtin.fail:
        msg: >-
          {{ rebootstrap_device }}: the digest-pinned TOE image {{ tn_toe_keep }} was not put back
          ({{ 'the manifest of the script was restored' if toe_bak is defined and toe_bak.dest is defined
          else 'the manifest was not changed by this step' }}): {{ ansible_failed_result.msg | default('') }}
          The TOE may run the template's toe_v4. Check it (kubectl -n kube-system get pods) and put the image
          back with playbooks/toe-image.yml -e toe_image={{ tn_toe_keep }}
      when: tn_toe_keep | default('') != ''

    - name: Checking the TOE image failed (nothing was remembered to put back)
      ansible.builtin.fail:
        msg: >-
          {{ rebootstrap_device }}: checking the TOE image after the bootstrap script failed:
          {{ ansible_failed_result.msg | default('') }}
      when: tn_toe_keep | default('') == ''
