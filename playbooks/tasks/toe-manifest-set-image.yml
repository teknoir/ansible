---
# Put toe_image (registry/repo[:tag]@sha256:...) and imagePullPolicy IfNotPresent on the toe container of the
# TOE manifest, pin the TOE pod to the k3s server node (nodeSelector node-role.kubernetes.io/control-plane: "true"
# directly under the pod spec, unless toe_pin_server=false) and wait for the Deployment to carry it. Backs the
# manifest up first, outside the manifests directory (k3s would apply a backup inside it). Needs toe_image,
# toe_old_image and toe_old_policy (the current image line), toe_pin_needed and toe_pin_node (toe-pin-check.yml,
# run before this), toe_wait_timeout, the vars of playbooks/vars/toe-manifest.yml, and sets toe_bak (the caller's
# rescue restores it). Nothing is changed when the manifest already is as wanted. The caller sets become.
#
# The pin is why a TOE pod never lands on an agent node of the robot: TOE mounts hostPath /etc/teknoir (the device
# keys) and signs its MQTT JWT with rsa_private.pem from it, so on another computer it uses that computer's keys.
- name: Does the manifest have to change
  ansible.builtin.import_tasks: toe-manifest-plan.yml

- name: Make the backup directory (outside the manifests directory, so k3s does not apply backups)
  ansible.builtin.file:
    path: "{{ toe_backup_dir }}"
    state: directory
    mode: "0700"
  when: toe_edit_needed | bool

- name: Back up the manifest
  ansible.builtin.copy:
    src: "{{ toe_manifest }}"
    dest: "{{ toe_backup_dir }}/teknoir.yaml.bak-{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
    remote_src: true
    mode: preserve
  diff: false  # the manifest holds Secrets: --diff must not print it
  register: toe_bak
  when: (toe_edit_needed | bool) and not ansible_check_mode

# The pin first: if k3s applies the file between the two edits, the pod that results is the old image on the
# server node, never the new image on an unpinned pod.
- name: Pin the TOE pod to the server node (shared with the rollback)
  ansible.builtin.import_tasks: toe-manifest-pin.yml

- name: Replace the image and imagePullPolicy of the toe container only
  ansible.builtin.replace:
    path: "{{ toe_manifest }}"
    regexp: '{{ toe_re }}'
    replace: '\g<1>{{ toe_image }}\g<3>IfNotPresent'
  diff: false  # the manifest holds Secrets: --diff must not print it
  register: toe_edit

- name: Wait for the Deployment to carry the new image (k3s re-applies the file)
  ansible.builtin.command:
    argv: "{{ toe_kubectl_cmd + toe_get_image_argv }}"
  register: toe_cur
  until: toe_cur.stdout == toe_image
  retries: "{{ (toe_wait_timeout | int / 5) | int }}"
  delay: 5
  changed_when: false
  when: not ansible_check_mode

- name: Wait for the nodeSelector, the rollout and the TOE pod on the server node
  ansible.builtin.import_tasks: toe-manifest-wait.yml
